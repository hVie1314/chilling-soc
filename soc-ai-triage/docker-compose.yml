version: "3.9"

# ─────────────────────────────────────────────────────────────
# SOC AI Triage System – Docker Compose
# 4 containers: vector-db · llm-engine · api-backend · web-ui
# ─────────────────────────────────────────────────────────────

services:
  # ── 1. Qdrant vector database ──────────────────────────────
  vector-db:
    image: qdrant/qdrant:latest
    container_name: soc-vector-db
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - soc-net
    restart: unless-stopped

  # ── 2. vLLM serving Foundation-Sec-8B ──────────────────────
  llm-engine:
    image: vllm/vllm-openai:latest
    container_name: soc-llm-engine
    ports:
      - "8000:8000"
    volumes:
      - ./model_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model fdtn-ai/Foundation-Sec-8B
      --max-model-len 4096
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --trust-remote-code
      --guided-decoding-backend outlines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - soc-net
    restart: unless-stopped

  # ── 3. FastAPI orchestrator backend ────────────────────────
  api-backend:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: soc-api-backend
    ports:
      - "8080:8080"
    environment:
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
      - LLM_BASE_URL=http://llm-engine:8000/v1
      - COLLECTION_NAME=soc_knowledge_base
      - EMBEDDING_MODEL=nomic-ai/nomic-embed-text-v1.5
      - LOG_LEVEL=info
    depends_on:
      vector-db:
        condition: service_healthy
      llm-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - soc-net
    restart: unless-stopped

  # ── 4. Streamlit user interface ────────────────────────────
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: soc-web-ui
    ports:
      - "8501:8501"
    environment:
      - API_BACKEND_URL=http://api-backend:8080
    depends_on:
      api-backend:
        condition: service_healthy
    networks:
      - soc-net
    restart: unless-stopped

volumes: {}

networks:
  soc-net:
    driver: bridge
